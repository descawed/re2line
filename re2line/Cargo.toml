[package]
name = "re2line"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
binrw = "0.15.2"
enum-map = { version = "3.1.0", features = ["serde"] }
dirs = "6.0.0"
eframe = { version = "0.35.0", features = ["persistence" ] }
egui = { version = "0.35.0", features = ["persistence"] }
egui_plot = "0.36.0"
epaint = "0.35.0"
re2script = { git = "https://github.com/descawed/re2script.git", branch = "master" }
re2shared = { path = "../re2shared" }
residat = { git = "https://github.com/descawed/residat.git", branch = "master" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[features]
default = []
motion-simulation = []